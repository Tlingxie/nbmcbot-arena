[package]
name = "nbmcbot"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
azalea = { version = "=0.15.1", default-features = false, features = ["online-mode"] }
clap = { version = "4", features = ["derive"] }
nbmcbot-core = { path = "../nbmcbot-core" }
nbmcbot-plugins = { path = "../nbmcbot-plugins" }
parking_lot = "0.12"
# rsa 0.10.0-rc.13 in Azalea expects the pre-release PKCS#8 error API.
pkcs8 = "=0.11.0-rc.10"
spki = "=0.8.0-rc.4"
der = "=0.8.0-rc.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std", "signal", "sync", "time", "net", "process"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
simdnbt = "=0.9.0"
uuid = "1"
